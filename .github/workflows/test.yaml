on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

name: test
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run test:unit
            # The integration suite connects only to a local listener on a high port, so it
            # runs here too. It still resolves a handful of real domains, so a failure can
            # also mean DNS or a published MTA-STS policy changed rather than a code fault.
            - run: npm run test:integration
