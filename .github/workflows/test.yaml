on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

name: test
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            # Covers the socket layer too, against a listener the suite starts on a loopback
            # high port, so nothing here needs the outbound port 25 that runners block
            - run: npm run test:unit
            # Real DNS and a real MTA-STS policy fetch, which no unit test can cover. Kept
            # out of the blocking path because a failure can equally mean someone changed a
            # published record, and that should not stop an unrelated pull request.
            - run: npm run test:integration
              continue-on-error: true
