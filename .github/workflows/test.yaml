on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

name: test
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            # Unit tests only: the integration suite needs outbound port 25,
            # which GitHub-hosted runners block
            - run: npm run test:unit
