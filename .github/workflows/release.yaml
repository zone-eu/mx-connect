on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write
    issues: write
    id-token: write

name: release
jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci
            # Nothing else blocks the publish, so the suite that guards the tarball runs here.
            # The integration tests stay out: they need real DNS and a live MTA-STS policy, and
            # a published record changing is not a reason to abandon a release mid-flight.
            - run: npm run lint
            - run: npm run test:unit
            - run: npm publish --provenance --access public
